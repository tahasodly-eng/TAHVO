name: Sahb Android

on:
  push:
    branches: [ sahb-android ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: corretto

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug + release
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug assembleRelease bundleRelease --stacktrace 2>&1 | tee build.log

      - name: Publish build log
        if: always()
        run: |
          grep -nE "^e: |error:|FAILURE|What went wrong|BUILD (SUCCESSFUL|FAILED)|Unresolved|Could not" build.log > build_errors.txt || true
          tail -n 200 build.log > build_tail.txt
          ls -la app/build/outputs/apk/*/ > apk_list.txt 2>&1 || true
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | sort -V | tail -1)
          { echo "== permissions in release APK"; $AAPT dump permissions app/build/outputs/apk/release/app-release-unsigned.apk; } > permissions.txt 2>&1 || true
          scripts/publish_results.sh sahb-build build_errors.txt build_tail.txt apk_list.txt permissions.txt

      - name: Publish release APK
        continue-on-error: true
        run: |
          tag="sahb-${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/release/app-release-unsigned.apk Sahb-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab Sahb-unsigned.aab
          gh release create "$tag" Sahb-unsigned.apk Sahb-unsigned.aab --target "$GITHUB_SHA" --title "Sahb build ${GITHUB_RUN_NUMBER}" --notes "Automated build ${GITHUB_SHA} (unsigned)." --prerelease

      - name: Test tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/emu_test.sh

      - name: Publish test results
        if: always()
        run: scripts/publish_results.sh sahb-test test_out
