name: Build TAHVO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: corretto
          cache: gradle

      - name: Prepare
        run: |
          touch local.properties keystore.properties
          chmod +x gradlew

      - name: Build github release APK
        run: ./gradlew assembleGithubRelease --stacktrace 2>&1 | tee build.log

      - name: Fail if build failed
        run: ls app/build/outputs/apk/github/release/*arm64*.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: tahvo-arm64
          path: app/build/outputs/apk/github/release/*arm64*.apk

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: tahvo-universal
          path: app/build/outputs/apk/github/release/*universal*.apk
